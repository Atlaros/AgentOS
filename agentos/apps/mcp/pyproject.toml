[project]
name = "agentos-mcp"
version = "0.1.0"
description = "AgentOS MCP server (thin surface over REST/SDK)"
requires-python = ">=3.12"
dependencies = [
  "agentos-sdk",
  "mcp>=1.6",
]

[tool.uv.sources]
agentos-sdk = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agentos_mcp"]

[project.scripts]
agentos-mcp = "agentos_mcp.server:main"

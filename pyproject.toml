[project]
name = "agentos-workspace"
version = "0.1.0"
description = "AgentOS — financial infrastructure for AI agents"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "agentos",
  "agentos-api",
]

[tool.uv.workspace]
members = ["packages/agentos", "apps/api"]

[tool.uv.sources]
agentos = { workspace = true }
agentos-api = { workspace = true }

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "httpx>=0.27",
  "ruff>=0.8",
  "mypy>=1.13",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["agentos", "agentos_api"]

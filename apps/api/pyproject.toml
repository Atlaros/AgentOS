[project]
name = "agentos-api"
version = "0.1.0"
description = "AgentOS FastAPI application"
requires-python = ">=3.12"
dependencies = [
  "agentos",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
]

[tool.uv.sources]
agentos = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agentos_api"]

[project.scripts]
agentos-api = "agentos_api.main:run"
